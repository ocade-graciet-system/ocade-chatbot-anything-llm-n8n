# Le nom de votre workflow
name: Increment Version and Run Build

# L'événement qui déclenche le workflow
# Ce workflow sera déclenché chaque fois qu'un code est poussé sur la branche master
on:
  push:
    branches:
      - master
permissions:
  contents: write
  packages: write
  actions: write

# Définir le répertoire de travail pour le plugin
env:
  PLUGIN_FILE: ocade-fusion-anythingllm-chatbot.php

jobs:
  incremental-version:
    # Le type de runner que le job va utiliser
    # Ce job sera exécuté sur une machine virtuelle basée sur Ubuntu
    runs-on: ubuntu-latest

    # La séquence des étapes qui constitue le job
    steps:
      # Étape pour extraire le contenu du dépot
      # Cette action copie le contenu du dépot sur la machine virtuelle pour pouvoir travailler dessus
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Étape pour configurer l'environnement Node.js
      # Cette action installe Node.js sur la machine virtuelle et le configure pour utiliser le registre npm de GitHub
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
      
      # Étape pour configurer Git
      # Cette action configure Git pour utiliser l'adresse e-mail et le nom d'utilisateur du bot GitHub Actions pour les commits
      - name: Git config
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # Convertir les fins de ligne CRLF (Windows) en LF (Linux)
      - name: Fix line endings
        run: |
          sudo apt-get install -y dos2unix
          find . -type f -name "*.php" -exec dos2unix {} \;
          find . -type f -name "*.js" -exec dos2unix {} \;
          find . -type f -name "*.css" -exec dos2unix {} \;
          find . -type f -name "*.json" -exec dos2unix {} \;

      # Étape pour incrémenter la version et générer metadata.json
      - name: Increment version and generate metadata
        id: increment
        run: |
          # Extraire la version actuelle du fichier PHP
          CURRENT_VERSION=$(grep -oP "Version:\s*\K[\d.]+" ${{ env.PLUGIN_FILE }})
          echo "Version actuelle: $CURRENT_VERSION"

          # Incrémenter la version (dernière partie)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          LAST_INDEX=$((${#VERSION_PARTS[@]} - 1))
          VERSION_PARTS[$LAST_INDEX]=$((${VERSION_PARTS[$LAST_INDEX]} + 1))
          NEW_VERSION=$(IFS='.'; echo "${VERSION_PARTS[*]}")
          echo "Nouvelle version: $NEW_VERSION"

          # Mettre à jour la version dans le fichier PHP
          sed -i "s/Version:\s*$CURRENT_VERSION/Version: $NEW_VERSION/" ${{ env.PLUGIN_FILE }}

          # Extraire les métadonnées et créer metadata.json
          PLUGIN_NAME=$(grep -oP "Plugin Name:\s*\K.*" ${{ env.PLUGIN_FILE }})
          PLUGIN_URI=$(grep -oP "Plugin URI:\s*\K.*" ${{ env.PLUGIN_FILE }})
          DESCRIPTION=$(grep -oP "Description:\s*\K.*" ${{ env.PLUGIN_FILE }})
          AUTHOR=$(grep -oP "Author:\s*\K.*" ${{ env.PLUGIN_FILE }})
          AUTHOR_URI=$(grep -oP "Author URI:\s*\K.*" ${{ env.PLUGIN_FILE }})
          LICENSE=$(grep -oP "License:\s*\K.*" ${{ env.PLUGIN_FILE }})
          TEXT_DOMAIN=$(grep -oP "Text Domain:\s*\K.*" ${{ env.PLUGIN_FILE }})
          REQUIRES_WP=$(grep -oP "Requires at least:\s*\K.*" ${{ env.PLUGIN_FILE }})
          REQUIRES_PHP=$(grep -oP "Requires PHP:\s*\K.*" ${{ env.PLUGIN_FILE }})

          cat > metadata.json << EOF
          {
            "plugin_name": "$PLUGIN_NAME",
            "plugin_uri": "$PLUGIN_URI",
            "description": "$DESCRIPTION",
            "version": "$NEW_VERSION",
            "author": "$AUTHOR",
            "author_uri": "$AUTHOR_URI",
            "license": "$LICENSE",
            "text_domain": "$TEXT_DOMAIN",
            "requires_at_least": "$REQUIRES_WP",
            "requires_php": "$REQUIRES_PHP",
            "is_plugin": true
          }
          EOF

          # Exporter la version pour les étapes suivantes
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version mise à jour: $NEW_VERSION"
          echo "✅ metadata.json généré"

      # Étape pour faire le commit du changement de version
      - name: Commit new version
        run: |
          git add ${{ env.PLUGIN_FILE }} metadata.json
          git commit -m "[bot] Updated version to ${{ steps.increment.outputs.version }}"
        
      # Mettre en cache les dépendances npm
      # Cette action met en cache les dépendances npm pour éviter de les réinstaller à chaque fois
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Étape pour exécuter 'npm run build'
      # Cette action exécute 'npm ci' pour installer les dépendances du projet, puis 'npm run build' pour générer le build du projet
      # - name: Run Build
      #   run: |
      #     pwd
      #     ls -la
      #     npm i  # Utilisation de npm ci au lieu de npm install
      #     npm run build || echo "Build failed with exit code $?"

      # Étape pour vérifier le contenu du répertoire de travail.
      - name: Check working directory
        run: |
          echo "Checking contents of working directory..."
          ls -la

      # Étape pour ajouter le dossier généré au dépot
      - name: Add & Commit Build Folder
        run: |
          git add build || true
          git diff --cached --quiet || git commit -m "[bot] Updated build"

      # Étape pour vérifier l'état du dépot
      - name: Check Git status
        run: git status

      # Étape pour pousser le nouveau commit vers la branche master
      - name: Push new version to master branch
        uses: ocade-graciet-system/action-push-master@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
      
      # Étape pour créer une archive .zip du projet
      - name: Create zip archive
        run: zip --symlinks -r ocade-fusion-anythingllm-chatbot.zip . -x ".git/*" -x ".github/*"
      
      # Étape pour publier la release
      - name: Publish release
        uses: "ocade-graciet-system/action-releases@v1"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ steps.increment.outputs.version }}"
          prerelease: true
          title: "${{ steps.increment.outputs.version }}"
          files: |
            ocade-fusion-anythingllm-chatbot.zip
            ./metadata.json